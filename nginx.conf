server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /board {
        return 301 https://byebyeboard.com/board/;
    }

    location = /zh {
        return 301 https://byebyeboard.com/zh/;
    }

    location = /board/ {
        expires -1;
        try_files /board/index.html =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name www.byebyeboard.com;
    return 301 https://byebyeboard.com$request_uri;
}
